---
# 快速连通验证：tailscale status + 两机互 ping + 217 经 Mac 批量访问测试 URL
# 用法:
#   ./.venv/bin/ansible-playbook playbooks/verify.yml
#   ./.venv/bin/ansible-playbook playbooks/verify.yml -e '{"test_urls":["https://www.google.com","https://github.com"]}'
#   ./.venv/bin/ansible-playbook playbooks/verify.yml -e @test-urls.yml

- name: 收集两节点的 tailscale 状态
  hosts: all
  become: "{{ ts_become | bool }}"
  gather_facts: false
  tasks:
    - name: tailscale status
      ansible.builtin.command:
        cmd: "{{ ts_install_dir }}/tailscale --socket={{ ts_socket }} status"
      register: ts_status
      changed_when: false
      failed_when: false

    - name: 本节点 tailscale IPv4
      ansible.builtin.command:
        cmd: "{{ ts_install_dir }}/tailscale --socket={{ ts_socket }} ip -4"
      register: ts_ip
      changed_when: false
      failed_when: false

    - name: 输出状态与出口节点信息
      ansible.builtin.debug:
        msg:
          - "===== {{ inventory_hostname }} status ====="
          - "{{ ts_status.stdout_lines }}"

- name: 从 mac 向远端 ping（验证两机 mesh 连通）
  hosts: local
  become: false
  tasks:
    - name: ping 10.9.202.217 的 tailscale IP
      ansible.builtin.command:
        cmd: "ping -c 2 {{ hostvars['box-217'].ts_ip.stdout }}"
      when: hostvars['box-217'].ts_ip.rc == 0
      register: ping_result
      changed_when: false
      failed_when: false

    - name: ping 结果
      ansible.builtin.debug:
        msg: "{{ ping_result.stdout_lines | default(['ping 失败，确认两端已 tailscale up']) }}"

- name: 验证 217 经 Mac 出口节点批量访问测试 URL
  hosts: remote
  become: "{{ ts_become | bool }}"
  gather_facts: false
  vars:
    # 默认测试列表，可通过 group_vars 或 -e test_urls 覆盖
    test_urls:
      - https://github.com
      - https://www.google.com
  tasks:
    - name: 批量 curl 测试 URL（流量应经 exit node=mac-mini 转发）
      ansible.builtin.command:
        cmd: >-
          curl -4 -sS -o /dev/null
          -w 'HTTP %{http_code} from %{remote_ip} in %{time_total}s'
          --connect-timeout 5
          --max-time 15
          {{ item }}
      loop: "{{ test_urls }}"
      register: curl_results
      changed_when: false
      failed_when: false

    - name: 查看当前出口节点
      ansible.builtin.command:
        cmd: "{{ ts_install_dir }}/tailscale --socket={{ ts_socket }} status --json"
      register: st_json
      changed_when: false
      failed_when: false

    - name: 输出批量访问结果
      ansible.builtin.debug:
        msg: |
          ===== {{ inventory_hostname }} 经 Mac exit node 访问测试 =====
          测试 URL 列表: {{ test_urls }}
          {% for r in curl_results.results %}
          217 -> {{ r.item }}:
            {{ r.stdout | default(r.stderr) | trim }}
          {% endfor %}
          {% set ok = curl_results.results | selectattr('rc', 'equalto', 0) | list %}
          汇总: {{ ok | length }}/{{ curl_results.results | length }} 成功
          若失败：确认 Mac 已 up --advertise-exit-node 且管理后台已审批 exit node。
          若 google 等被墙站点失败：确认 Mac 已配置 ts_forward_proxy 指向 Clash Verge。

- name: 验证 217 内网双向可达（exit node 不破坏内网访问）
  hosts: remote
  become: "{{ ts_become | bool }}"
  gather_facts: false
  tasks:
    - name: 获取物理网卡默认网关（非 tailscale0）
      ansible.builtin.shell: |
        ip -4 route show default | grep -v tailscale | awk '{print $3}' | head -1
      register: lan_gw
      changed_when: false
      failed_when: false

    - name: ping 内网网关（验证出方向内网直连）
      ansible.builtin.command:
        cmd: "ping -c 2 -W 2 {{ lan_gw.stdout }}"
      register: gw_ping
      changed_when: false
      failed_when: false
      when: lan_gw.stdout | length > 0

    - name: 获取本机物理 IP（非 tailscale0）
      ansible.builtin.shell: |
        ip -4 addr show | grep -v tailscale | grep 'inet ' | awk '{print $2}' | cut -d/ -f1 | head -1
      register: lan_ip
      changed_when: false
      failed_when: false

    - name: 查看内网 ip rule 配置
      ansible.builtin.shell: |
        echo "=== ip rule (5260 lan-access) ==="
        ip rule show | grep '^5260:' || echo '(无 lan-access 规则)'
        echo ""
        echo "=== table 52 throw/default ==="
        ip route show table 52 | grep -E '^(throw|default)' || echo '(无)'
      register: lan_rules_check
      changed_when: false

    - name: 输出内网连通性验证
      ansible.builtin.debug:
        msg:
          - "===== {{ inventory_hostname }} 内网双向可达验证 ====="
          - "物理 IP: {{ lan_ip.stdout | default('(未检测到)') }}"
          - "内网网关: {{ lan_gw.stdout | default('(未检测到)') }}"
          - "网关 ping: {{ '✓ 可达' if (gw_ping.rc | default(1)) == 0 else '✗ 不可达' }}"
          - ""
          - "{{ lan_rules_check.stdout_lines }}"
          - ""
          - "若网关不可达:"
          - "  1. 确认已运行 deploy.yml --tags up,lan"
          - "  2. 确认 ts_ignore_routes 包含本机网段"
          - "  3. 检查 tailscale-lan-rules.service: systemctl status tailscale-lan-rules"
          - "  4. 手动应用: /usr/local/sbin/tailscale-lan-rules.sh up"
