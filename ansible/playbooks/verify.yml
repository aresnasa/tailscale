---
# 快速连通验证：tailscale status + 两机互 ping + 217 经 Mac 批量访问测试 URL
# 用法:
#   ./.venv/bin/ansible-playbook playbooks/verify.yml
#   ./.venv/bin/ansible-playbook playbooks/verify.yml -e '{"test_urls":["https://www.google.com","https://github.com"]}'
#   ./.venv/bin/ansible-playbook playbooks/verify.yml -e @test-urls.yml

- name: 收集两节点的 tailscale 状态
  hosts: all
  become: "{{ ts_become | bool }}"
  gather_facts: false
  tasks:
    - name: tailscale status
      ansible.builtin.command:
        cmd: "{{ ts_install_dir }}/tailscale --socket={{ ts_socket }} status"
      register: ts_status
      changed_when: false
      failed_when: false

    - name: 本节点 tailscale IPv4
      ansible.builtin.command:
        cmd: "{{ ts_install_dir }}/tailscale --socket={{ ts_socket }} ip -4"
      register: ts_ip
      changed_when: false
      failed_when: false

    - name: 输出状态与出口节点信息
      ansible.builtin.debug:
        msg:
          - "===== {{ inventory_hostname }} status ====="
          - "{{ ts_status.stdout_lines }}"

- name: 从 mac 向远端 probe（验证两机 mesh 连通）
  hosts: local
  become: false
  tasks:
    # Mac 是 userspace-networking 模式（无 tailscale0 网卡），系统 ping 打不进 tailnet
    # 必须走 tailscaled 自身的 tailscale ping（disco/TSMP 探测，用户态下也可用）
    - name: tailscale ping 10.9.202.217 的 tailscale IP
      ansible.builtin.command:
        cmd: "{{ ts_install_dir }}/tailscale --socket={{ ts_socket }} ping -c 2 --timeout 8s {{ hostvars['box-217'].ts_ip.stdout }}"
      when: (hostvars['box-217'].ts_ip.rc | default(1)) == 0
      register: ping_result
      changed_when: false
      failed_when: false

    - name: probe 结果
      ansible.builtin.debug:
        msg: "{{ ping_result.stdout_lines | default(ping_result.stderr_lines | default(['tailscale ping 失败，确认两端已 tailscale up'])) }}"

- name: 验证 217 经 Mac 出口节点批量访问测试 URL
  hosts: remote
  become: "{{ ts_become | bool }}"
  gather_facts: false
  vars:
    # 默认测试列表，可通过 group_vars 或 -e test_urls 覆盖
    test_urls:
      - https://github.com
      - https://www.google.com
    # GFW 环境下 UDP DNS 被污染，用 --resolve 绕过 DNS 直接指定 IP
    test_resolve_args: "--resolve github.com:443:20.205.243.166 --resolve www.google.com:443:142.250.80.46"
  tasks:
    - name: 批量 curl 测试 URL（流量应经 exit node=mac-mini 转发，用 --resolve 绕过 DNS）
      ansible.builtin.command:
        cmd: >-
          curl -4 -sS -o /dev/null
          -w 'HTTP %{http_code} from %{remote_ip} in %{time_total}s'
          --connect-timeout 10
          --max-time 30
          {{ test_resolve_args }}
          {{ item }}
      loop: "{{ test_urls }}"
      register: curl_results
      changed_when: false
      failed_when: false

    - name: 查看当前出口节点
      ansible.builtin.command:
        cmd: "{{ ts_install_dir }}/tailscale --socket={{ ts_socket }} status --json"
      register: st_json
      changed_when: false
      failed_when: false

    - name: 输出批量访问结果
      ansible.builtin.debug:
        msg: |
          ===== {{ inventory_hostname }} 经 Mac exit node 访问测试 =====
          测试 URL 列表: {{ test_urls }}
          {% for r in curl_results.results %}
          217 -> {{ r.item }}:
            {{ r.stdout | default(r.stderr) | trim }}
          {% endfor %}
          {% set ok = curl_results.results | selectattr('rc', 'equalto', 0) | list %}
          汇总: {{ ok | length }}/{{ curl_results.results | length }} 成功
          若失败：确认 Mac 已 up --advertise-exit-node 且管理后台已审批 exit node。
          若 google 等被墙站点失败：确认 Mac 上的 Clash 已开启 TUN/增强模式（接管全部出站流量）。

- name: 验证 217 内网双向可达（exit node 不破坏内网访问）
  hosts: remote
  become: "{{ ts_become | bool }}"
  gather_facts: false
  tasks:
    - name: 获取物理网卡默认网关（非 tailscale0）
      ansible.builtin.shell: |
        ip -4 route show default | grep -v tailscale | awk '{print $3}' | head -1
      register: lan_gw
      changed_when: false
      failed_when: false

    - name: ping 内网网关（验证出方向内网直连）
      ansible.builtin.command:
        cmd: "ping -c 2 -W 2 {{ lan_gw.stdout }}"
      register: gw_ping
      changed_when: false
      failed_when: false
      when: lan_gw.stdout | length > 0

    - name: 获取本机物理 IP（非 tailscale0/lo）
      ansible.builtin.shell: |
        ip -4 addr show | grep -vE 'tailscale|lo:|lo\s' | grep 'inet ' | grep -v '127\.0\.0\.1' | awk '{print $2}' | cut -d/ -f1 | head -1
      register: lan_ip
      changed_when: false
      failed_when: false

    - name: 查看内网 ip rule 配置
      ansible.builtin.shell: |
        echo "=== ip rule (5260 lan-access) ==="
        ip rule show | grep '^5260:' || echo '(无 lan-access 规则)'
        echo ""
        echo "=== table 52 throw/default ==="
        ip route show table 52 | grep -E '^(throw|default)' || echo '(无)'
      register: lan_rules_check
      changed_when: false

    - name: 输出内网连通性验证
      ansible.builtin.debug:
        msg:
          - "===== {{ inventory_hostname }} 内网双向可达验证 ====="
          - "物理 IP: {{ lan_ip.stdout | default('(未检测到)') }}"
          - "内网网关: {{ lan_gw.stdout | default('(未检测到)') }}"
          - "网关 ping: {{ '✓ 可达' if (gw_ping.rc | default(1)) == 0 else '✗ 不可达' }}"
          - ""
          - "{{ lan_rules_check.stdout_lines }}"
          - ""
          - "若网关不可达:"
          - "  1. 确认已运行 deploy.yml --tags up,lan"
          - "  2. 确认 ts_ignore_routes 包含本机网段"
          - "  3. 检查 tailscale-lan-rules.service: systemctl status tailscale-lan-rules"
          - "  4. 手动应用: /usr/local/sbin/tailscale-lan-rules.sh up"

# ═══════════════════════════════════════════════════════════════
# 验证总结（汇总上述所有 probe 结果）
# ═══════════════════════════════════════════════════════════════
- name: 验证总结
  hosts: localhost
  gather_facts: false
  tasks:
    - name: 汇总两节点连通状态
      ansible.builtin.debug:
        msg: |
          ══════════════════════════════════════════════════════════
                      Tailscale 验证总结
          ══════════════════════════════════════════════════════════
          {% set mac = hostvars['mac-mini'] | default({}) %}
          {% set box = hostvars['box-217'] | default({}) %}
          节点状态:
            mac-mini:
              tailscale status rc = {{ mac.ts_status.rc | default('?') }}
              tailnet IP           = {{ mac.ts_ip.stdout | default('(未获取)') }}
            box-217:
              tailscale status rc = {{ box.ts_status.rc | default('?') }}
              tailnet IP           = {{ box.ts_ip.stdout | default('(未获取)') }}

          Mesh 探测 (Mac → 217 tailscale ping):
            {% set pong_received = 'pong from' in (mac.ping_result.stdout | default('')) %}
            {% if pong_received %}
            ✓ 成功（pong from 已收到；可能走 DERP 而非 direct，已由 pong 确认连通）
            {% elif (mac.ping_result.rc | default(1)) == 0 %}
            ✓ 成功
            {% else %}
            ✗ 失败/未运行
            {% endif %}

          内网 (217 → 物理网关 ping):
            {{ '✓ 成功' if (box.gw_ping.rc | default(1)) == 0 else '✗ 失败/未运行' }}

          外网 (217 经 Mac exit node curl):
            {% set results = box.curl_results.results | default([]) %}
            {% set ok = results | selectattr('rc', 'equalto', 0) | list %}
            {{ ok | length }}/{{ results | length }} 成功

          ────────────────────────────────────────────────────────
          失败排查:
            Mac tailnet IP 为空 → Mac 未登录，重跑 deploy.yml --tags up
            tailscale ping 失败 → 两机未 join 同 tailnet 或被 ACL 拦截
            mesh 走 DERP 而非 direct → 不是错误，多数跨地域场景都走 DERP 中转
            外网全失败 → 管理后台未审批 exit node，或 Mac 上 Clash 未开 TUN/增强模式
          ══════════════════════════════════════════════════════════
