---
# 部署 tailscaled + tailscale 到 本机 Mac 和 远程 Linux
#
# 分阶段设计，支持按 tag 单独执行：
#   build   — 交叉编译二进制（仅本机）
#   install — 分发二进制 + 生成配置 + 启动 daemon
#   detect  — 检测远程节点内网网段，填充 ts_ignore_routes
#   up      — tailscale up（Mac 广播 exit node，客户端指向 Mac）
#   lan     — 配置内网绕过 table 52 的 ip rule
#   verify  — 验证连通性（tailscale status + 内网 ping + 外网 curl）
#
# 用法:
#   cd ansible
#   # 阶段 1: 构建并安装（不涉及登录/配置）
#   ./.venv/bin/ansible-playbook playbooks/deploy.yml --tags build,install
#
#   # 阶段 2: 检测内网 + 配置 exit node + lan-access（需要先登录）
#   ./.venv/bin/ansible-playbook playbooks/deploy.yml --tags detect,up,lan
#
#   # 阶段 3: 验证
#   ./.venv/bin/ansible-playbook playbooks/deploy.yml --tags verify
#   # 或直接用专门的验证 playbook
#   ./.venv/bin/ansible-playbook playbooks/verify.yml
#
#   # 全量一键（带 authkey 自动注册）
#   ./.venv/bin/ansible-playbook playbooks/deploy.yml -e ts_authkey=tskey-auth-xxx
#
# 共用变量位于 playbooks/group_vars/all.yml（Ansible 自动加载 playbook 同级 group_vars）

# ═══════════════════════════════════════════════════════════════
# 阶段 1a: 构建二进制（仅本机交叉编译）
# ═══════════════════════════════════════════════════════════════
- name: 构建两个平台的二进制（在本机交叉编译）
  hosts: localhost
  gather_facts: false
  tags: [build]
  pre_tasks:
    - name: 确保 dist 目录存在
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../dist"
        state: directory
        mode: "0755"

  tasks:
    - name: make build（darwin/arm64 + linux/amd64）
      ansible.builtin.command:
        cmd: "{{ item }}"
        chdir: "{{ playbook_dir }}/../.."
      loop:
        - make build GOOS=darwin GOARCH=arm64
        - make build GOOS=linux GOARCH=amd64
      register: build_result
      changed_when: true
      failed_when: build_result.rc != 0

    - name: 校验构建产物齐全
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../dist/{{ item }}"
      loop:
        - tailscale-darwin-arm64
        - tailscaled-darwin-arm64
        - tailscale-linux-amd64
        - tailscaled-linux-amd64
      register: artifacts

    - name: 缺少产物则中止
      ansible.builtin.assert:
        that: "{{ item.stat.exists }}"
        fail_msg: "缺少构建产物 {{ item.stat.path }}"
      loop: "{{ artifacts.results }}"

# ═══════════════════════════════════════════════════════════════
# 阶段 1b: 分发二进制 + 生成配置 + 启动 daemon
# ═══════════════════════════════════════════════════════════════
- name: 安装 tailscaled/tailscale 并启动 daemon
  hosts: all
  become: "{{ ts_become | bool }}"
  gather_facts: false
  tags: [install]
  tasks:
    - name: 安装 tailscale / tailscaled 二进制（按平台选产物）
      ansible.builtin.copy:
        src: "{{ ts_dist_dir }}/{{ item }}-{{ ts_goos }}-{{ ts_goarch }}"
        dest: "{{ ts_install_dir }}/{{ item }}"
        mode: "0755"
      loop: [tailscale, tailscaled]
      notify: 重启 tailscaled

    - name: 创建状态/socket 目录
      ansible.builtin.file:
        path: "{{ (ts_state_dir | dirname) if ts_platform == 'darwin' else (ts_socket | dirname) }}"
        state: directory
        mode: "0755"

    - name: 生成共享配置 tailscaled.env
      ansible.builtin.template:
        src: tailscaled.env.j2
        dest: "{{ '/etc/default/tailscaled' if ts_platform == 'linux' else (ts_state_dir | dirname) + '/tailscaled.env' }}"
        mode: "0644"

    # ---- Linux: systemd ----
    - name: "[linux] 安装 tailscaled.service"
      ansible.builtin.template:
        src: tailscaled.service.j2
        dest: /etc/systemd/system/tailscaled.service
        mode: "0644"
      when: ts_platform == 'linux'
      notify: 重启 tailscaled

    - name: "[linux] daemon-reload 并启动 tailscaled"
      ansible.builtin.systemd:
        name: tailscaled
        state: started
        enabled: true
        daemon_reload: true
      when: ts_platform == 'linux'

    # ---- macOS: 用户级 launchd（非 root，userspace-networking）----
    - name: "[mac] 安装用户级 LaunchAgent plist"
      ansible.builtin.template:
        src: com.tailscale.tailscaled.plist.j2
        dest: "{{ lookup('env','HOME') }}/Library/LaunchAgents/com.tailscale.tailscaled.plist"
        mode: "0644"
      when: ts_platform == 'darwin'
      notify:
        - 重装 launchd tailscaled
        - 重启 tailscaled

    - name: "[mac] 确保 tailscaled 已启动"
      ansible.builtin.shell:
        cmd: >-
          launchctl print gui/$(id -u)/com.tailscale.tailscaled >/dev/null 2>&1
          || launchctl bootstrap gui/$(id -u) {{ lookup('env','HOME') }}/Library/LaunchAgents/com.tailscale.tailscaled.plist
      when: ts_platform == 'darwin'
      changed_when: false

    # ---- 等待 daemon 就绪 ----
    - name: 等待 tailscaled daemon 就绪
      ansible.builtin.command:
        cmd: "{{ ts_install_dir }}/tailscale --socket={{ ts_socket }} status"
      register: daemon_ready
      changed_when: false
      failed_when: false
      retries: 5
      delay: 2
      until: daemon_ready.rc == 0 or 'Logged out' in (daemon_ready.stdout | default(''))

    - name: 输出 daemon 状态
      ansible.builtin.debug:
        msg:
          - "===== {{ inventory_hostname }} daemon 就绪 ====="
          - "{{ daemon_ready.stdout_lines | default(daemon_ready.stderr_lines | default(['无输出'])) }}"

  handlers:
    - name: 重装 launchd tailscaled
      ansible.builtin.shell:
        cmd: launchctl bootout gui/$(id -u)/com.tailscale.tailscaled
      when: ts_platform == 'darwin'
      ignore_errors: true

    - name: 重启 tailscaled
      ansible.builtin.shell:
        cmd: >-
          launchctl kickstart -k gui/$(id -u)/com.tailscale.tailscaled 2>/dev/null
          || launchctl bootstrap gui/$(id -u) {{ lookup('env','HOME') }}/Library/LaunchAgents/com.tailscale.tailscaled.plist
      when: ts_platform == 'darwin'
      listen: 重启 tailscaled

    - name: "[linux] 重启 tailscaled"
      ansible.builtin.systemd:
        name: tailscaled
        state: restarted
        daemon_reload: true
      when: ts_platform == 'linux'
      listen: 重启 tailscaled

# ═══════════════════════════════════════════════════════════════
# 阶段 2: 检测远程节点内网网段（填充 ts_ignore_routes）
# ═══════════════════════════════════════════════════════════════
- name: 检测远程节点内网网段（填充 ts_ignore_routes）
  # 扫描物理网卡的私有 IP，映射到 RFC1918 三大段（10/8, 172.16/12, 192.168/16）。
  # 仅在 ts_ignore_routes 未被 host_vars 显式设置（为空）时生效。
  hosts: remote
  become: true
  gather_facts: false
  tags: [detect]
  tasks:
    - name: 安装内网检测脚本
      ansible.builtin.template:
        src: detect-lan-cidrs.sh.j2
        dest: /usr/local/sbin/detect-lan-cidrs.sh
        mode: "0755"

    - name: 执行检测，获取本机私有网段
      ansible.builtin.command:
        cmd: /usr/local/sbin/detect-lan-cidrs.sh
      register: detected_cidrs
      changed_when: false

    - name: 检测到的 CIDR 列表写入 fact（若已有显式配置则跳过）
      ansible.builtin.set_fact:
        ts_ignore_routes: "{{ detected_cidrs.stdout_lines | select('match', '^[0-9]') | list }}"
      when:
        - ts_ignore_routes | default([]) | length == 0
        - detected_cidrs.stdout_lines | select('match', '^[0-9]') | list | length > 0

    - name: 展示自动检测结果
      ansible.builtin.debug:
        msg:
          - "===== {{ inventory_hostname }} 内网网段检测 ====="
          - "物理网卡检测到的 CIDR: {{ detected_cidrs.stdout_lines | select('match', '^[0-9]') | list }}"
          - "最终 ts_ignore_routes: {{ ts_ignore_routes }}"
      when: ts_ignore_routes | default([]) | length > 0

    - name: 若未检测到私有网段则提示
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }}: 未检测到物理网卡私有地址"
          - "ts_ignore_routes 保持为: {{ ts_ignore_routes | default([]) }}"
          - ">> 如需忽略内网，手动设置 host_vars 的 ts_ignore_routes"
      when: ts_ignore_routes | default([]) | length == 0

# ═══════════════════════════════════════════════════════════════
# 阶段 3a: 计算 up 命令（所有节点）
# ═══════════════════════════════════════════════════════════════
- name: 计算各节点的 tailscale up 命令（按 ts_role）
  hosts: all
  gather_facts: false
  tags: [up]
  tasks:
    - name: 拼装 up 命令
      ansible.builtin.set_fact:
        ts_up_cmd: >-
          {{ ts_install_dir }}/tailscale --socket={{ ts_socket }} up
          --hostname={{ inventory_hostname }}
          {% if ts_role == 'exit-node' %}--advertise-exit-node
          {% elif ts_role == 'exit-node-client' %}--exit-node={{ ts_exit_node }} --accept-routes --exit-node-allow-lan-access
          {% endif %}
          {% if ts_ignore_routes | default([]) | length > 0 %}--ignore-routes={{ ts_ignore_routes | join(',') }}
          {% endif %}
          {{ ts_up_extra_args }}

    - name: 预览将执行的 up 命令
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} [{{ ts_role | default('default') }}]: {{ ts_up_cmd | regex_replace('\\s+', ' ') }}"

# ═══════════════════════════════════════════════════════════════
# 阶段 3b: 出口节点 up（Mac 广播 exit node）
# ═══════════════════════════════════════════════════════════════
- name: 出口节点 up（Mac 广播 exit node）
  hosts: local
  become: "{{ ts_become | bool }}"
  gather_facts: false
  tags: [up]
  tasks:
    # ---- 有 authkey：自动注册 ----
    - name: tailscale up --advertise-exit-node（authkey 自动注册）
      ansible.builtin.command:
        cmd: "{{ ts_up_cmd }} --auth-key={{ ts_authkey }}"
      register: up_mac
      changed_when: true
      when: ts_authkey | length > 0

    # ---- 无 authkey：检查是否已登录 ----
    - name: 检查 Mac 是否已登录
      ansible.builtin.command:
        cmd: "{{ ts_install_dir }}/tailscale --socket={{ ts_socket }} status"
      register: mac_status
      changed_when: false
      failed_when: false
      when: ts_authkey | length == 0

    # ---- 未登录：尝试 up 捕获 URL ----
    - name: tailscale up（未登录时捕获登录 URL）
      ansible.builtin.shell: |
        timeout 15 {{ ts_up_cmd }} 2>&1 || true
      register: up_mac_nologin
      changed_when: false
      failed_when: false
      when:
        - ts_authkey | length == 0
        - "'Logged out' in (mac_status.stdout | default(''))"

    - name: 输出 Mac 登录指引
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════╗
          ║  Mac-mini (exit node) 需要登录认证                            ║
          ╠══════════════════════════════════════════════════════════════╣
          {% if 'login.tailscale.com' in (up_mac_nologin.stdout | default('')) %}
          ║  请在浏览器打开以下链接完成认证：                              ║
          ║  {{ (up_mac_nologin.stdout) | regex_search('https://login\\.tailscale\\.com/[^ ]+') }}
          ║  授权后 Mac 会自动加入 tailnet 并广播 exit node。            ║
          {% else %}
          ║  Mac 状态: {{ mac_status.stdout_lines | default(['未知']) }}
          ║  如需登录: {{ ts_up_cmd | regex_replace('\\s+', ' ') }}
          {% endif %}
          ╚══════════════════════════════════════════════════════════════╝
      when:
        - ts_authkey | length == 0
        - "'Logged out' in (mac_status.stdout | default(''))"

# ═══════════════════════════════════════════════════════════════
# 阶段 3c: 客户端 up 并指向 Mac 作为 exit node
# ═══════════════════════════════════════════════════════════════
- name: 客户端 up 并指向 Mac 作为 exit node
  hosts: remote
  become: "{{ ts_become | bool }}"
  gather_facts: false
  tags: [up]
  tasks:
    # ---- 有 authkey：自动注册 ----
    - name: tailscale up --exit-node（authkey 自动注册）
      ansible.builtin.command:
        cmd: "{{ ts_up_cmd }} --auth-key={{ ts_authkey }}"
      register: up_client
      changed_when: true
      failed_when: false
      when: ts_authkey | length > 0

    # ---- 无 authkey：检查是否已登录 ----
    - name: 检查客户端是否已登录
      ansible.builtin.command:
        cmd: "{{ ts_install_dir }}/tailscale --socket={{ ts_socket }} status"
      register: client_status
      changed_when: false
      failed_when: false
      when: ts_authkey | length == 0

    # ---- 未登录：尝试 up 捕获 URL ----
    - name: tailscale up（未登录时捕获登录 URL）
      ansible.builtin.shell: |
        timeout 15 {{ ts_up_cmd }} 2>&1 || true
      register: up_client_nologin
      changed_when: false
      failed_when: false
      when:
        - ts_authkey | length == 0
        - "'Logged out' in (client_status.stdout | default(''))"

    - name: 输出客户端登录指引
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════╗
          ║  {{ inventory_hostname }} (exit node client) 需要登录认证    ║
          ╠══════════════════════════════════════════════════════════════╣
          {% if 'login.tailscale.com' in (up_client_nologin.stdout | default('')) %}
          ║  请在浏览器打开以下链接完成认证：                              ║
          ║  {{ (up_client_nologin.stdout) | regex_search('https://login\\.tailscale\\.com/[^ ]+') }}
          ║  授权后客户端会自动加入 tailnet 并通过 Mac 出网。            ║
          {% else %}
          ║  客户端状态: {{ client_status.stdout_lines | default(['未知']) }}
          ║  up 输出: {{ up_client_nologin.stdout_lines | default([]) }}
          {% endif %}
          ║                                                              ║
          ║  ⚠ 若提示 exit node 不可用：                                 ║
          ║    1. 确保 Mac 已认证并 up --advertise-exit-node              ║
          ║    2. 到管理后台 Machines → Mac → Edit route settings        ║
          ║       勾选 'Use as exit node' → Save                         ║
          ║    3. 重跑: ./.venv/bin/ansible-playbook playbooks/deploy.yml --tags up
          ╚══════════════════════════════════════════════════════════════╝
      when:
        - ts_authkey | length == 0
        - "'Logged out' in (client_status.stdout | default(''))"

    - name: 若客户端 up 失败（authkey 模式），提示去管理后台审批
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════╗
          ║  {{ inventory_hostname }} up 失败 — exit node 未审批        ║
          ╠══════════════════════════════════════════════════════════════╣
          ║  rc={{ up_client.rc | default('?') }}
          ║  输出: {{ up_client.stdout_lines | default([]) }}
          ║  错误: {{ up_client.stderr_lines | default([]) }}
          ║                                                              ║
          ║  >> exit node 必须在管理后台一次性审批：                      ║
          ║     https://login.tailscale.com/admin/machines               ║
          ║     → 找到 Mac 节点 → ⋯ → Edit route settings                ║
          ║     → 勾选 'Use as exit node' → Save                        ║
          ║                                                              ║
          ║  审批后重跑:                                                 ║
          ║     ./.venv/bin/ansible-playbook playbooks/deploy.yml --tags up
          ╚══════════════════════════════════════════════════════════════╝
      when: (ts_authkey | length > 0) and (up_client.rc | default(1) != 0)

# ═══════════════════════════════════════════════════════════════
# 阶段 3d: 应用路由忽略配置 + 内网绕过 table 52
# ═══════════════════════════════════════════════════════════════
- name: 应用路由忽略配置（幂等）
  hosts: all
  become: "{{ ts_become | bool }}"
  gather_facts: false
  tags: [up, lan]
  tasks:
    - name: tailscale set --ignore-routes
      ansible.builtin.command:
        cmd: "{{ ts_install_dir }}/tailscale --socket={{ ts_socket }} set --ignore-routes={{ ts_ignore_routes | join(',') }}"
      when: ts_ignore_routes | default([]) | length > 0
      register: set_ignore
      changed_when: set_ignore.rc | default(1) == 0
      failed_when: false

    - name: 若 set 失败给出提示
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }}: set --ignore-routes rc={{ set_ignore.rc | default('skipped') }}"
          - "{{ set_ignore.stderr_lines | default([]) }}"
          - ">> 若 daemon 未部署/未登录，先跑 --tags install 或带 ts_authkey 的 up。"
      when: (set_ignore.rc | default(0)) != 0

- name: 配置内网绕过 table 52（ip rule 5260）
  # --ignore-routes 只处理出方向，入方向回包仍命中 table 52 的 throw/default。
  # 在 ip rule priority 5260（< Tailscale 5270）插 to <CIDR> lookup main 规则。
  hosts: remote
  become: true
  gather_facts: false
  tags: [lan]
  tasks:
    - name: 创建 /etc/tailscale 目录
      ansible.builtin.file:
        path: /etc/tailscale
        state: directory
        mode: "0755"

    - name: 写入 lan-routes.conf（CIDR 列表）
      ansible.builtin.copy:
        dest: /etc/tailscale/lan-routes.conf
        content: |
          # 内网网段列表（由 ansible deploy.yml 生成）
          # 这些 CIDR 的流量绕过 Tailscale table 52，直接走 main 表
          # 与 tailscale up --ignore-routes 使用同一份列表
          {% for cidr in ts_ignore_routes | default([]) %}
          {{ cidr }}
          {% endfor %}
        mode: "0644"
      register: lan_conf

    - name: 安装 tailscale-lan-rules.sh
      ansible.builtin.template:
        src: tailscale-lan-rules.sh.j2
        dest: /usr/local/sbin/tailscale-lan-rules.sh
        mode: "0755"

    - name: 安装 tailscale-lan-rules.service
      ansible.builtin.template:
        src: tailscale-lan-rules.service.j2
        dest: /etc/systemd/system/tailscale-lan-rules.service
        mode: "0644"

    - name: daemon-reload 并启用 service
      ansible.builtin.systemd:
        name: tailscale-lan-rules
        state: "{{ 'restarted' if lan_conf.changed else 'started' }}"
        enabled: true
        daemon_reload: true

    - name: 立即应用 ip rule（幂等）
      ansible.builtin.command:
        cmd: /usr/local/sbin/tailscale-lan-rules.sh up
      register: lan_rules_apply
      changed_when: "'已添加' in lan_rules_apply.stdout"

    - name: 输出 lan-access 状态
      ansible.builtin.debug:
        msg:
          - "===== {{ inventory_hostname }} 内网绕过 table 52 配置 ====="
          - "忽略网段: {{ ts_ignore_routes | default([]) }}"
          - "{{ lan_rules_apply.stdout_lines | default([]) }}"

# ═══════════════════════════════════════════════════════════════
# 阶段 4: 验证连通性
# ═══════════════════════════════════════════════════════════════
- name: 验证 daemon 与 CLI 连通
  hosts: all
  become: "{{ ts_become | bool }}"
  gather_facts: false
  tags: [verify]
  tasks:
    - name: tailscale version / status
      ansible.builtin.command:
        cmd: "{{ ts_install_dir }}/tailscale --socket={{ ts_socket }} {{ item }}"
      loop: [version, status]
      register: verify
      changed_when: false
      failed_when: false

    - name: 记录 tailscale status 结果（供总结使用）
      ansible.builtin.set_fact:
        ts_status: "{{ verify.results | selectattr('item', 'equalto', 'status') | first }}"

    - name: 输出验证结果
      ansible.builtin.debug:
        msg:
          - "===== {{ inventory_hostname }} : tailscale {{ item.item }} ====="
          - "{{ item.stdout_lines | default(item.stderr_lines) }}"
      loop: "{{ verify.results }}"
      loop_control:
        label: "{{ item.item }}"

- name: 验证 217 内网双向可达（exit node 不破坏内网访问）
  hosts: remote
  become: "{{ ts_become | bool }}"
  gather_facts: false
  tags: [verify]
  tasks:
    - name: 获取物理网卡默认网关（非 tailscale0）
      ansible.builtin.shell: |
        ip -4 route show default | grep -v tailscale | awk '{print $3}' | head -1
      register: lan_gw
      changed_when: false
      failed_when: false

    - name: ping 内网网关（验证出方向内网直连）
      ansible.builtin.command:
        cmd: "ping -c 2 -W 2 {{ lan_gw.stdout }}"
      register: gw_ping
      changed_when: false
      failed_when: false
      when: lan_gw.stdout | length > 0

    - name: 获取本机物理 IP（非 tailscale0/lo）
      ansible.builtin.shell: |
        ip -4 addr show | grep -vE 'tailscale|lo:|lo\s' | grep 'inet ' | grep -v '127\.0\.0\.1' | awk '{print $2}' | cut -d/ -f1 | head -1
      register: lan_ip
      changed_when: false
      failed_when: false

    - name: 查看内网 ip rule 配置
      ansible.builtin.shell: |
        echo "=== ip rule (5260 lan-access) ==="
        ip rule show | grep '^5260:' || echo '(无 lan-access 规则)'
        echo ""
        echo "=== table 52 throw/default ==="
        ip route show table 52 | grep -E '^(throw|default)' || echo '(无)'
      register: lan_rules_check
      changed_when: false

    - name: 输出内网连通性验证
      ansible.builtin.debug:
        msg:
          - "===== {{ inventory_hostname }} 内网双向可达验证 ====="
          - "物理 IP: {{ lan_ip.stdout | default('(未检测到)') }}"
          - "内网网关: {{ lan_gw.stdout | default('(未检测到)') }}"
          - "网关 ping: {{ '✓ 可达' if (gw_ping.rc | default(1)) == 0 else '✗ 不可达' }}"
          - ""
          - "{{ lan_rules_check.stdout_lines }}"

- name: 验证 217 经 Mac exit node 访问外网
  hosts: remote
  become: "{{ ts_become | bool }}"
  gather_facts: false
  tags: [verify]
  vars:
    test_urls:
      - https://github.com
      - https://www.google.com
  tasks:
    - name: 批量 curl 测试 URL（流量应经 exit node 转发）
      ansible.builtin.command:
        cmd: >-
          curl -4 -sS -o /dev/null
          -w 'HTTP %{http_code} from %{remote_ip} in %{time_total}s'
          --connect-timeout 10
          --max-time 30
          {{ item }}
      loop: "{{ test_urls }}"
      register: curl_results
      changed_when: false
      failed_when: false

    - name: 输出外网访问结果
      ansible.builtin.debug:
        msg: |
          ===== {{ inventory_hostname }} 经 Mac exit node 访问测试 =====
          测试 URL 列表: {{ test_urls }}
          {% for r in curl_results.results %}
          217 -> {{ r.item }}:
            {{ r.stdout | default(r.stderr) | trim }}
          {% endfor %}
          {% set ok = curl_results.results | selectattr('rc', 'equalto', 0) | list %}
          汇总: {{ ok | length }}/{{ curl_results.results | length }} 成功
          若失败：确认 Mac 已 up --advertise-exit-node 且管理后台已审批 exit node。
          若 google 等被墙站点失败：确认 Mac 已配置 ts_forward_proxy 指向 Clash Verge。

