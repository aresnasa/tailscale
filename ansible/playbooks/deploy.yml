---
# 部署 tailscaled + tailscale 到 本机 Mac 和 远程 Linux，并验证连通
#
# 用法:
#   cd ansible
#   ansible-playbook playbooks/deploy.yml -K                             # 部署 + 本地验证
#   ansible-playbook playbooks/deploy.yml -K -e ts_authkey=tskey-xxx     # 顺带 tailscale up 加入 tailnet
#
# 单步执行: --tags build | deploy | up | verify

# deploy.yml 由 playbook_dir 相对定位变量与产物
# 共用变量位于 playbooks/group_vars/all.yml（Ansible 自动加载 playbook 同级 group_vars）
- name: 构建两个平台的二进制（在本机交叉编译）
  hosts: localhost
  gather_facts: false
  tags: [build]
  pre_tasks:
    - name: 确保 dist 目录存在
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../dist"
        state: directory
        mode: "0755"

  tasks:
    - name: make build（darwin/arm64 + linux/amd64）
      ansible.builtin.command:
        cmd: "{{ item }}"
        chdir: "{{ playbook_dir }}/../.."
      loop:
        - make build GOOS=darwin GOARCH=arm64
        - make build GOOS=linux GOARCH=amd64
      register: build_result
      changed_when: true
      failed_when: build_result.rc != 0

    - name: 校验构建产物齐全
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../dist/{{ item }}"
      loop:
        - tailscale-darwin-arm64
        - tailscaled-darwin-arm64
        - tailscale-linux-amd64
        - tailscaled-linux-amd64
      register: artifacts

    - name: 缺少产物则中止
      ansible.builtin.assert:
        that: "{{ item.stat.exists }}"
        fail_msg: "缺少构建产物 {{ item.stat.path }}"
      loop: "{{ artifacts.results }}"

- name: 分发并安装 tailscaled/tailscale
  hosts: all
  become: "{{ ts_become | bool }}"
  gather_facts: false
  # mac 走用户级 launchd（非 root），linux 走 systemd（root）
  tags: [deploy]
  tasks:
    - name: 安装 tailscale / tailscaled 二进制（按平台选产物）
      ansible.builtin.copy:
        src: "{{ ts_dist_dir }}/{{ item }}-{{ ts_goos }}-{{ ts_goarch }}"
        dest: "{{ ts_install_dir }}/{{ item }}"
        mode: "0755"
      loop: [tailscale, tailscaled]
      notify: 重启 tailscaled

    - name: 创建状态/socket 目录
      ansible.builtin.file:
        path: "{{ (ts_state_dir | dirname) if ts_platform == 'darwin' else (ts_socket | dirname) }}"
        state: directory
        mode: "0755"

    - name: 生成共享配置 tailscaled.env
      ansible.builtin.template:
        src: tailscaled.env.j2
        dest: "{{ '/etc/default/tailscaled' if ts_platform == 'linux' else (ts_state_dir | dirname) + '/tailscaled.env' }}"
        mode: "0644"

    # ---- Linux: systemd ----
    - name: "[linux] 安装 tailscaled.service"
      ansible.builtin.template:
        src: tailscaled.service.j2
        dest: /etc/systemd/system/tailscaled.service
        mode: "0644"
      when: ts_platform == 'linux'
      notify: 重启 tailscaled

    - name: "[linux] daemon-reload 并启动 tailscaled"
      ansible.builtin.systemd:
        name: tailscaled
        state: started
        enabled: true
        daemon_reload: true
      when: ts_platform == 'linux'

    # ---- macOS: 用户级 launchd（非 root，userspace-networking）----
    - name: "[mac] 安装用户级 LaunchAgent plist"
      ansible.builtin.template:
        src: com.tailscale.tailscaled.plist.j2
        dest: "{{ lookup('env','HOME') }}/Library/LaunchAgents/com.tailscale.tailscaled.plist"
        mode: "0644"
      when: ts_platform == 'darwin'
      notify:
        - 重装 launchd tailscaled
        - 重启 tailscaled

    - name: "[mac] 确保 tailscaled 已启动"
      ansible.builtin.shell:
        cmd: >-
          launchctl print gui/$(id -u)/com.tailscale.tailscaled >/dev/null 2>&1
          || launchctl bootstrap gui/$(id -u) {{ lookup('env','HOME') }}/Library/LaunchAgents/com.tailscale.tailscaled.plist
      when: ts_platform == 'darwin'
      changed_when: false

  handlers:
    # plist 变更时先卸载旧服务；未装载时 bootout 报错属正常，忽略
    - name: 重装 launchd tailscaled
      ansible.builtin.shell:
        cmd: launchctl bootout gui/$(id -u)/com.tailscale.tailscaled
      when: ts_platform == 'darwin'
      ignore_errors: true

    # 已装载则 kickstart 重启，未装载则 bootstrap 装载；必须在 bootout 之后执行
    - name: 重启 tailscaled
      ansible.builtin.shell:
        cmd: >-
          launchctl kickstart -k gui/$(id -u)/com.tailscale.tailscaled 2>/dev/null
          || launchctl bootstrap gui/$(id -u) {{ lookup('env','HOME') }}/Library/LaunchAgents/com.tailscale.tailscaled.plist
      when: ts_platform == 'darwin'
      listen: 重启 tailscaled

    - name: "[linux] 重启 tailscaled"
      ansible.builtin.systemd:
        name: tailscaled
        state: restarted
        daemon_reload: true
      when: ts_platform == 'linux'
      listen: 重启 tailscaled

- name: 计算各节点的 tailscale up 命令（按 ts_role）
  hosts: all
  gather_facts: false
  tags: [up]
  tasks:
    - name: 拼装 up 命令
      ansible.builtin.set_fact:
        ts_up_cmd: >-
          {{ ts_install_dir }}/tailscale --socket={{ ts_socket }} up
          --hostname={{ inventory_hostname }}
          {% if ts_role == 'exit-node' %}--advertise-exit-node
          {% elif ts_role == 'exit-node-client' %}--exit-node={{ ts_exit_node }} --accept-routes
          {% endif %}
          {% if ts_ignore_routes | default([]) | length > 0 %}--ignore-routes={{ ts_ignore_routes | join(',') }}
          {% endif %}
          {{ ts_up_extra_args }}

    - name: 预览将执行的 up 命令（未提供 authkey 时仅展示，便于人工执行）
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} [{{ ts_role | default('default') }}]: {{ ts_up_cmd | regex_replace('\\s+', ' ') }}"

- name: 可选：出口节点先 up（Mac 广播 exit node）
  hosts: local
  become: "{{ ts_become | bool }}"
  gather_facts: false
  tags: [up]
  tasks:
    - name: tailscale up --advertise-exit-node（Mac）
      ansible.builtin.command:
        cmd: "{{ ts_up_cmd }} --auth-key={{ ts_authkey }}"
      register: up_mac
      changed_when: true
      when: ts_authkey | length > 0

- name: 可选：客户端 up 并指向 Mac 作为 exit node
  hosts: remote
  become: "{{ ts_become | bool }}"
  gather_facts: false
  tags: [up]
  tasks:
    - name: tailscale up --exit-node（217）
      ansible.builtin.command:
        cmd: "{{ ts_up_cmd }} --auth-key={{ ts_authkey }}"
      register: up_client
      changed_when: true
      failed_when: false
      when: ts_authkey | length > 0

    - name: 若客户端 up 失败，提示去管理后台审批 Mac 的 exit node
      ansible.builtin.debug:
        msg:
          - "217 up 返回 rc={{ up_client.rc | default('skipped') }}"
          - "{{ up_client.stdout_lines | default([]) }}"
          - "{{ up_client.stderr_lines | default([]) }}"
          - ">> 若提示 exit node 不可用：请到 Tailscale 管理后台 Machines → mac-mini → Edit route settings，"
          - "   勾选 'Use as exit node' 并 Save（exit node 无 ACL 属性，必须后台一次性审批），随后重跑："
          - "   ./.venv/bin/ansible-playbook playbooks/deploy.yml --tags up"
      when: (ts_authkey | length > 0) and (up_client.rc | default(1) != 0)

- name: 应用路由忽略配置（幂等；不重新 up 也能变更）
  hosts: all
  become: "{{ ts_become | bool }}"
  gather_facts: false
  tags: [up]
  tasks:
    - name: tailscale set --ignore-routes
      ansible.builtin.command:
        cmd: "{{ ts_install_dir }}/tailscale --socket={{ ts_socket }} set --ignore-routes={{ ts_ignore_routes | join(',') }}"
      when: ts_ignore_routes | default([]) | length > 0
      register: set_ignore
      changed_when: set_ignore.rc | default(1) == 0
      failed_when: false # 未登录/daemon 未起时 rc!=0 属预期，下面统一提示

    - name: 若 set 失败给出提示
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }}: set --ignore-routes rc={{ set_ignore.rc | default('skipped') }}"
          - "{{ set_ignore.stderr_lines | default([]) }}"
          - ">> 若 daemon 未部署/未登录，先跑 --tags deploy 或带 ts_authkey 的 up。"
      when: (set_ignore.rc | default(0)) != 0

- name: 验证 daemon 与 CLI 连通
  hosts: all
  become: "{{ ts_become | bool }}"
  gather_facts: false
  tags: [verify]
  tasks:
    - name: tailscale version / status
      ansible.builtin.command:
        cmd: "{{ ts_install_dir }}/tailscale --socket={{ ts_socket }} {{ item }}"
      loop: [version, status]
      register: verify
      changed_when: false
      failed_when: false # 未登录时 rc=1 属预期（Logged out.），不算失败

    - name: 输出验证结果
      ansible.builtin.debug:
        msg:
          - "===== {{ inventory_hostname }} : tailscale {{ item.item }} ====="
          - "{{ item.stdout_lines | default(item.stderr_lines) }}"
      loop: "{{ verify.results }}"
      loop_control:
        label: "{{ item.item }}"
