# 测试环境：本机 Mac + 远程 Linux 两节点互通 Tailscale
#
# ts_goos/ts_goarch 决定从 ../dist 选择哪个构建产物；
# ts_platform 决定 daemon 管理方式（darwin -> launchd, linux -> systemd）。

[local]
# Mac 作为出口节点（exit node）：217 的出网流量经 Mac 转发访问 GitHub
mac-mini ansible_connection=local ts_platform=darwin ts_goos=darwin ts_goarch=arm64 ts_role=exit-node

[remote]
# 217 作为出口节点客户端：--exit-node 指向 mac-mini 的 tailscale 主机名
box-217 ansible_host=10.9.202.217 ansible_user=root ts_platform=linux ts_goos=linux ts_goarch=amd64 ts_role=exit-node-client ts_exit_node=mac-mini
