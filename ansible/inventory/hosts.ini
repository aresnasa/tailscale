# 测试环境：本机 Mac + 远程 Linux 两节点互通 Tailscale
#
# ts_goos/ts_goarch 决定从 ../dist 选择哪个构建产物；
# ts_platform 决定 daemon 管理方式（darwin -> 用户级 launchd，linux -> systemd）。
# ts_become 决定是否提权：Mac 走非 root（userspace-networking），Linux 走 root。

[local]
# Mac 作为出口节点（exit node）：217 的出网流量经 Mac 转发访问 GitHub
# 非 root 部署：二进制装 /opt/homebrew/bin，状态/socket 放用户目录，
# tailscaled 用 --tun=userspace-networking 跑成用户级 LaunchAgent，无需 sudo。
mac-mini ansible_connection=local ts_platform=darwin ts_goos=darwin ts_goarch=arm64 ts_role=exit-node ts_become=false ts_install_dir=/Users/aresnasa/.tailscale/bin ts_state_dir=/Users/aresnasa/.tailscale/state ts_socket=/Users/aresnasa/.tailscale/tailscaled.sock ts_user=aresnasa

[remote]
# 217 作为出口节点客户端：--exit-node 指向 mac-mini 的 tailscale 主机名
box-217 ansible_host=10.9.202.217 ansible_user=root ts_platform=linux ts_goos=linux ts_goarch=amd64 ts_role=exit-node-client ts_exit_node=100.112.144.72 ts_become=true ts_install_dir=/usr/local/bin ts_state_dir=/var/lib/tailscale ts_socket=/var/run/tailscale/tailscaled.sock ts_user=root
